# Validate, build, test and release an Unreal Engine code plugin for Fab.
#
# Called by ci.yml, with the scripts in .github/ci; see .github/ci/README.md. Both are written to
# move out to a shared repository once they run smoothly, so every plugin can call them.
#
#   package  GitHub-hosted. Tests the CI scripts, checks the plugin against Fab's code plugin
#            requirements and writes the source zips Fab is given, one per engine version.
#   build    Build machine. Compiles each zip with BuildPlugin against the installed engine, as
#            Epic does when it receives a submission, then runs the plugin's automation tests on
#            the result.
#
# A pull request from an outside contributor runs none of this until a maintainer has read it and
# approved the run: the organization requires approval for all outside contributors. That review
# is what stands between a pull request and the build machine.
#   release  On a vX.Y.Z tag, once every engine passed: a GitHub release carrying the same zips,
#            and a job summary with the links and notes to paste into the Fab portal.
#   notify   Optional Discord message for releases and failures.
name: Unreal plugin

on:
  workflow_call:
    inputs:
      engine-versions:
        description: JSON array of engine versions to build, test and package for, e.g. '["5.7", "5.8"]'.
        type: string
        default: '["5.8"]'
      run-tests:
        description: Run the plugin's automation tests in a headless editor.
        type: boolean
        default: true
      test-filter:
        description: Automation test filter. Defaults to the plugin name, so name tests '<Plugin>.<Area>.<Case>'.
        type: string
        default: ''
      strict-includes:
        description: Also compile without unity builds or shared precompiled headers, which catches missing includes.
        type: boolean
        default: true
      build-runner:
        description: >-
          JSON array of labels selecting the build machine, which needs the engine versions installed from the Epic
          Games Launcher. The unreal label marks runners set up for this, with their own account and caches; see
          .github/ci/scripts/Install-BuildRunner.ps1.
        type: string
        default: '["self-hosted", "Windows", "unreal"]'
    secrets:
      discord-webhook-url:
        description: Discord webhook for release and failure notices. Optional.
        required: false

jobs:
  package:
    name: Validate and package
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      plugin: ${{ steps.package.outputs.plugin }}
      version: ${{ steps.package.outputs.version }}
      release: ${{ steps.kind.outputs.release }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      # The scripts are tested before anything relies on them, the build machine included.
      - name: Test CI scripts
        shell: powershell
        run: |
          & plugin\.github\ci\tests\Invoke-SelfTest.ps1

      # A tag like v1.2.3 is a release: its version is stamped into the zips and they are published.
      - name: Release or CI build
        id: kind
        shell: powershell
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $Release = ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -match '^v\d')
          "release=$($Release.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          if ($Release) { "version=$env:REF_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii }

      - name: Validate and package
        id: package
        shell: powershell
        env:
          ENGINE_VERSIONS: ${{ inputs.engine-versions }}
          RELEASE_VERSION: ${{ steps.kind.outputs.version }}
        run: |
          & plugin\.github\ci\scripts\New-SourcePackage.ps1 -PluginDir plugin -OutDir dist -EngineVersions $env:ENGINE_VERSIONS -Version $env:RELEASE_VERSION

      - name: Upload source packages
        uses: actions/upload-artifact@v7
        with:
          name: source-packages
          path: dist/
          if-no-files-found: error

  build:
    name: Build and test (UE ${{ matrix.engine }})
    needs: package
    # Compiling runs the pull request's code on the build machine (Build.cs files are C#). For an
    # outside contributor that only happens once a maintainer has approved the run; see the top.
    runs-on: ${{ fromJSON(inputs.build-runner) }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Concurrent BuildPlugin runs on one machine share UnrealBuildTool state and fail spuriously.
      max-parallel: 1
      matrix:
        engine: ${{ fromJSON(inputs.engine-versions) }}
    steps:
      # Only the scripts: the build uses the packaged zip, never the checkout.
      - name: Check out CI scripts
        uses: actions/checkout@v7
        with:
          path: plugin
          sparse-checkout: .github/ci

      # Fails the job at once, with an annotation, if this machine lacks the engine. A version
      # that cannot be built here would reach Fab untested, so this is never skipped.
      - name: Check Unreal Engine ${{ matrix.engine }}
        shell: powershell
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          & plugin\.github\ci\scripts\Find-UnrealEngine.ps1 -EngineVersion $env:ENGINE

      # The workspace survives between jobs on a self-hosted runner.
      - name: Clear previous packages
        shell: powershell
        run: if (Test-Path dist) { Remove-Item dist -Recurse -Force }

      - name: Download source packages
        uses: actions/download-artifact@v8
        with:
          name: source-packages
          path: dist

      # Builds the zip, not the checkout, so what passes is exactly what Fab receives. The work
      # folder is in the runner's temp directory, which is short (paths nest deep) and emptied
      # after every job.
      #
      # Caches go in this repository's own folder on the runner, .ue-cache in the workspace, kept
      # between runs. The engine's defaults are per-user or machine-wide and shared with the other
      # projects the build machine builds, so they are never used; see "Caches" in
      # .github/ci/README.md.
      - name: Build
        id: build
        shell: powershell
        env:
          ENGINE: ${{ matrix.engine }}
          PACKAGE: dist\${{ needs.package.outputs.plugin }}-${{ needs.package.outputs.version }}-UE${{ matrix.engine }}.zip
          STRICT_INCLUDES: ${{ inputs.strict-includes }}
        run: |
          & plugin\.github\ci\scripts\Build-Plugin.ps1 -PackageZip $env:PACKAGE -EngineVersion $env:ENGINE -WorkDir "$env:RUNNER_TEMP\b" -CacheDir "$env:GITHUB_WORKSPACE\.ue-cache\UE$env:ENGINE" -StrictIncludes:($env:STRICT_INCLUDES -eq 'true')

      - name: Test
        if: inputs.run-tests
        shell: powershell
        env:
          ENGINE: ${{ matrix.engine }}
          PLUGIN_DIR: ${{ steps.build.outputs.plugin-dir }}
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          & plugin\.github\ci\scripts\Invoke-PluginTests.ps1 -PluginDir $env:PLUGIN_DIR -EngineVersion $env:ENGINE -WorkDir "$env:RUNNER_TEMP\t" -CacheDir "$env:GITHUB_WORKSPACE\.ue-cache\UE$env:ENGINE" -Filter $env:TEST_FILTER

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-UE${{ matrix.engine }}
          path: |
            ${{ runner.temp }}\b\logs
            ${{ runner.temp }}\t\logs
            ${{ runner.temp }}\t\report
          if-no-files-found: ignore
          retention-days: 14

      # Prebuilt for Win64, for anyone on the team who wants the plugin without compiling it.
      - name: Upload built plugin
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.package.outputs.plugin }}-UE${{ matrix.engine }}-Win64
          path: ${{ steps.build.outputs.plugin-dir }}
          retention-days: 14

  release:
    name: Publish release
    needs: [package, build]
    if: needs.package.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          path: plugin
          fetch-depth: 0 # release notes are the commits since the previous tag

      - name: Download source packages
        uses: actions/download-artifact@v8
        with:
          name: source-packages
          path: dist

      - name: Publish
        id: publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          & plugin\.github\ci\scripts\Publish-Release.ps1 -PluginDir plugin -PackageDir dist -Tag $env:TAG -Repository $env:REPOSITORY

  notify:
    name: Notify
    needs: [package, build, release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send Discord message
        env:
          WEBHOOK: ${{ secrets.discord-webhook-url }}
          PLUGIN: ${{ needs.package.outputs.plugin }}
          VERSION: ${{ needs.package.outputs.version }}
          RESULTS: ${{ needs.package.result }} ${{ needs.build.result }} ${{ needs.release.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          if [ "$RELEASE_RESULT" = success ]; then
            title="${PLUGIN} ${VERSION} is ready for Fab"
            description="Built and tested. Release: ${RELEASE_URL}
          The run summary has the links and version notes to paste into the Fab portal: ${RUN_URL}"
            color=3066993
          elif [[ " $RESULTS " == *" failure "* ]]; then
            title="${PLUGIN:-$REPOSITORY} CI failed on ${REF}"
            description="${RUN_URL}"
            color=15158332
          else
            exit 0
          fi
          jq -n --arg title "$title" --arg description "$description" --argjson color "$color" \
            '{username: "GitHub Actions", embeds: [{title: $title, description: $description, color: $color}]}' |
            curl --fail --silent --show-error -H 'Content-Type: application/json' -d @- "$WEBHOOK"
