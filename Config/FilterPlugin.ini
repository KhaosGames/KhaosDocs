[FilterPlugin]
; Extra files to package with the plugin, on top of the descriptor, Source, Content, Resources and
; Shaders, which are always included. This is read both by BuildPlugin, which is how Epic packages
; the plugin for Fab buyers, and by the CI that builds the Fab source zip.
;
; Paths are relative to the plugin root and may use "...", "*" and "?" to match directories,
; files and single characters. Prefix a line with "-" to exclude instead.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll
